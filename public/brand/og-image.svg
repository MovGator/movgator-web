<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#070209"/>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070209;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24102e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f5a623;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <ellipse cx="600" cy="126" rx="600" ry="200" fill="url(#goldGlow)"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="80" fill="#f5a623" opacity="0.08"/>
  <circle cx="1050" cy="480" r="120" fill="#3b1f4a" opacity="0.15"/>
  <circle cx="1100" cy="100" r="60" fill="#f5a623" opacity="0.05"/>
  
  <!-- Main content area -->
  <g transform="translate(120, 180)">
    <!-- Logo/icon representation -->
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="60" fill="#f5a623"/>
      <circle cx="60" cy="60" r="35" fill="#fff"/>
      <circle cx="60" cy="60" r="18" fill="#24102e"/>
    </svg>
    
    <text x="160" y="50" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#f7f6f8" letter-spacing="-1">MovGator</text>
    <text x="160" y="100" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#c9b8d2">Find what to watch tonight</text>
    
    <!-- Feature tags -->
    <g transform="translate(160, 140)">
      <rect x="0" y="0" width="140" height="36" rx="18" fill="#3b1f4a" stroke="#f5a623" stroke-width="2"/>
      <text x="70" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5a623" text-anchor="middle">Discover</text>
      
      <rect x="155" y="0" width="140" height="36" rx="18" fill="#3b1f4a" stroke="#f5a623" stroke-width="2"/>
      <text x="225" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5a623" text-anchor="middle">Roll Dice</text>
      
      <rect x="310" y="0" width="140" height="36" rx="18" fill="#3b1f4a" stroke="#f5a623" stroke-width="2"/>
      <text x="380" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5a623" text-anchor="middle">Movie Night</text>
    </g>
    
    <!-- CTA -->
    <rect x="160" y="210" width="280" height="56" rx="28" fill="#f5a623"/>
    <text x="300" y="248" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#24102e" text-anchor="middle">Start Free</text>
  </g>
  
  <!-- TMDB attribution -->
  <text x="120" y="590" font-family="system-ui, sans-serif" font-size="12" fill="#5c4a63" opacity="0.8">This product uses the TMDB API but is not endorsed or certified by TMDB.</text>
</svg>